
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover Kushiro & Beyond</title>

<meta name="description"
content="Explore Kushiro and Eastern Hokkaido. Discover local food, beautiful nature, wildlife, hot springs and recommended travel routes.">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

/* =====================================
   Basic design
===================================== */

:root {
    --green: #28664d;
    --dark-green: #173e32;
    --light-green: #e9f3e9;
    --blue: #368ab5;
    --orange: #e58b39;
    --purple: #9064ac;
    --pink: #cf7085;
    --brown: #97774e;
    --text: #29443a;
    --muted: #71847a;
    --white: #ffffff;
    --background: #f5f8f4;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 85px;
}

body {
    margin: 0;
    font-family: Arial, "Hiragino Sans", sans-serif;
    color: var(--text);
    background: var(--background);
}

button, input, select {
    font: inherit;
}

button, select {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
a:focus-visible {
    outline: 3px solid #368ab5;
    outline-offset: 3px;
}

a {
    color: var(--green);
}

button {
    transition: 0.2s;
}

/* =====================================
   Navigation
===================================== */

.topbar {
    position: sticky;
    top: 0;
    z-index: 1100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 15px 5%;
    background: var(--dark-green);
    color: white;
    box-shadow: 0 3px 10px #0002;
}

.logo {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
}

.nav-links {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 13px;
}

.nav-links a:hover {
    text-decoration: underline;
}

.language-switch {
    display: flex;
    gap: 6px;
}

.language-switch button {
    border: 1px solid #ffffff70;
    background: transparent;
    color: white;
    padding: 7px 14px;
    border-radius: 20px;
}

.language-switch button.active {
    background: white;
    color: var(--dark-green);
}

/* =====================================
   Hero
===================================== */

.hero {
    position: relative;
    min-height: 430px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 70px 20px;
    background:
        linear-gradient(
            135deg,
            #163f32,
            #407f63,
            #3286a2
        );
    background-size: cover;
    background-position: center;
}

.hero-content {
    position: relative;
    z-index: 1;
}

.eyebrow {
    font-size: 13px;
    letter-spacing: 5px;
    font-weight: bold;
}

.hero h1 {
    font-size: clamp(38px, 7vw, 84px);
    margin: 20px 0;
    line-height: 1.1;
    letter-spacing: 1px;
    text-shadow: 0 3px 20px #0005;
}

.hero p {
    font-size: 18px;
    line-height: 1.8;
}

.hero-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 25px;
}

.hero-button {
    display: inline-block;
    background: white;
    color: var(--green);
    padding: 14px 26px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
}

.hero-button.secondary {
    color: white;
    border: 1px solid white;
    background: #ffffff18;
}

.hero-credit {
    position: absolute;
    bottom: 7px;
    right: 10px;
    font-size: 10px;
    background: #0006;
    padding: 4px 8px;
    border-radius: 4px;
}

.hero-credit a {
    color: white;
}

/* =====================================
   Main content
===================================== */

main {
    max-width: 1450px;
    margin: auto;
    padding: 30px 22px;
}

.intro {
    max-width: 850px;
    margin: 15px auto 35px;
    text-align: center;
}

.intro h2,
.section-heading {
    color: var(--green);
    font-size: clamp(25px, 4vw, 34px);
}

.intro p,
.section-description {
    line-height: 1.9;
}

.section-heading {
    margin: 50px 0 12px;
    text-align: center;
}

.section-description {
    text-align: center;
    color: var(--muted);
    max-width: 800px;
    margin: 0 auto 25px;
}

.statistics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    max-width: 950px;
    margin: 30px auto 40px;
}

.stat {
    background: white;
    padding: 24px 8px;
    text-align: center;
    border-radius: 16px;
    box-shadow: 0 3px 15px #00000008;
}

.stat strong {
    display: block;
    color: var(--green);
    font-size: 34px;
}

.stat span {
    display: block;
    margin-top: 7px;
    font-size: 13px;
    color: var(--muted);
}

/* =====================================
   Search and filters
===================================== */

.filter-panel {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 3px 20px #00000008;
    margin-bottom: 20px;
}

.search-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
}

.search-row input,
.search-row select,
.route-select {
    width: 100%;
    min-width: 0;
    padding: 13px;
    border: 1px solid #d5e1d8;
    background: #f9fbf9;
    border-radius: 10px;
    color: var(--text);
}

.category-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.category-button {
    background: white;
    border: 1px solid #dce5dc;
    border-radius: 25px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 14px;
    font-weight: bold;
}

.category-button:hover {
    background: var(--light-green);
}

.category-button.active {
    color: white;
    background: var(--button-color, #28664d);
    border-color: transparent;
}

.result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
    font-size: 13px;
    color: var(--muted);
}

.reset-button {
    color: var(--green);
    border: none;
    background: transparent;
    text-decoration: underline;
}

/* =====================================
   Map
===================================== */

.map-panel {
    background: white;
    border-radius: 20px;
    padding: 12px;
    box-shadow: 0 5px 25px #0000000b;
}

.map-instruction {
    text-align: center;
    padding: 10px;
    font-size: 14px;
}

#map {
    width: 100%;
    height: 650px;
    border-radius: 13px;
    background: #dfece1;
    z-index: 1;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    padding: 16px 5px;
    font-size: 12px;
}

.legend-dot {
    display: inline-block;
    height: 11px;
    width: 11px;
    margin-right: 5px;
    border-radius: 50%;
}

.map-note {
    font-size: 11px;
    text-align: center;
    color: var(--muted);
    line-height: 1.6;
}

.map-route-banner {
    display: none;
    background: var(--dark-green);
    color: white;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 12px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}

.map-route-banner.visible {
    display: flex;
}

.map-route-banner button {
    border: 1px solid white;
    background: transparent;
    color: white;
    padding: 8px 14px;
    border-radius: 20px;
}

.custom-marker {
    background: transparent;
    border: 0;
}

.marker-pin {
    width: 36px;
    height: 36px;
    border: 3px solid white;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 9px #0005;
}

.marker-pin span {
    transform: rotate(45deg);
    font-size: 17px;
}

.route-pin {
    width: 34px;
    height: 34px;
    border: 3px solid white;
    border-radius: 50%;
    color: white;
    font-weight: bold;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px #0005;
}

/* =====================================
   Map popup
===================================== */

.leaflet-popup-content-wrapper {
    padding: 0;
    border-radius: 16px;
    overflow: hidden;
}

.leaflet-popup-content {
    margin: 0;
    width: 285px !important;
}

.leaflet-container a.leaflet-popup-close-button {
    top: 6px;
    right: 6px;
    border-radius: 50%;
    background: white;
    color: #234738;
}

.popup-photo {
    width: 100%;
    height: 165px;
    object-fit: cover;
    display: block;
}

.popup-body {
    padding: 15px;
}

.popup-body h3 {
    font-size: 20px;
    line-height: 1.3;
    color: var(--green);
    margin: 12px 0 5px;
}

.popup-body p {
    font-size: 13px;
    line-height: 1.7;
}

.area-label {
    font-size: 11px;
    color: var(--muted);
}

.badge {
    display: inline-block;
    color: white;
    border-radius: 20px;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: bold;
}

.recommendation {
    padding: 12px;
    border-radius: 7px;
    background: #eef5ea;
    border-left: 4px solid #80a471;
    font-size: 13px;
    line-height: 1.7;
}

.season-info {
    margin-top: 12px;
    padding: 9px;
    background: #f6f5ee;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.6;
}

.direction-link {
    display: block;
    text-align: center;
    background: var(--green);
    color: white !important;
    padding: 11px;
    margin-top: 13px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
}

.photo-credit {
    display: block;
    font-size: 9px;
    color: var(--muted);
    padding: 4px 9px;
    overflow-wrap: anywhere;
}

/* =====================================
   Recommended routes
===================================== */

.routes-section {
    margin-top: 45px;
    background: var(--light-green);
    border-radius: 24px;
    padding: 25px;
}

.routes-section .section-heading {
    margin-top: 10px;
}

.route-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 270px), 1fr)
    );
    gap: 20px;
}

.route-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid transparent;
    box-shadow: 0 3px 15px #0000000b;
    display: flex;
    flex-direction: column;
}

.route-card.selected {
    border-color: var(--green);
    box-shadow: 0 5px 20px #28664d25;
}

.route-image {
    height: 180px;
    width: 100%;
    object-fit: cover;
    display: block;
}

.route-card-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.route-number {
    font-size: 11px;
    color: var(--muted);
    font-weight: bold;
    letter-spacing: 2px;
}

.route-card h3 {
    margin: 10px 0;
    color: var(--green);
    font-size: 21px;
    line-height: 1.4;
}

.route-meta {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin: 8px 0;
}

.route-meta span {
    background: #edf3ed;
    font-size: 11px;
    padding: 6px 9px;
    border-radius: 20px;
}

.route-card p {
    line-height: 1.7;
    font-size: 14px;
}

.route-button {
    display: block;
    border: none;
    border-radius: 9px;
    background: var(--green);
    color: white;
    font-size: 14px;
    padding: 12px 14px;
    margin-top: auto;
    font-weight: bold;
}

.route-button:hover {
    background: var(--dark-green);
}

.route-detail {
    background: white;
    border-radius: 18px;
    margin-top: 25px;
    padding: 25px;
    display: none;
}

.route-detail.visible {
    display: block;
}

.route-detail h2 {
    color: var(--green);
    line-height: 1.4;
}

.route-detail p {
    line-height: 1.8;
}

.day-heading {
    background: var(--light-green);
    border-radius: 8px;
    padding: 12px;
    color: var(--green);
    margin-top: 25px;
}

.timeline {
    position: relative;
    margin: 20px 0;
    padding: 0;
}

.timeline-item {
    display: flex;
    gap: 16px;
    position: relative;
    padding-bottom: 22px;
}

.timeline-item:not(:last-child)::before {
    content: "";
    position: absolute;
    width: 2px;
    background: #c5daca;
    top: 32px;
    bottom: 0;
    left: 16px;
}

.timeline-number {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--green);
    color: white;
    font-weight: bold;
    z-index: 1;
}

.timeline-content {
    flex: 1;
    background: #f6f9f5;
    border-radius: 10px;
    padding: 14px;
}

.timeline-content h4 {
    color: var(--green);
    margin: 0 0 7px;
    font-size: 17px;
}

.timeline-content p {
    margin: 5px 0;
    font-size: 13px;
}

.timeline-content button {
    border: none;
    background: transparent;
    color: var(--green);
    padding: 6px 0;
    text-decoration: underline;
    font-size: 12px;
    font-weight: bold;
}

.route-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 20px 0;
}

.primary-button,
.secondary-button {
    display: inline-block;
    border-radius: 9px;
    padding: 12px 20px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    text-align: center;
}

.primary-button {
    color: white;
    background: var(--green);
    border: 1px solid var(--green);
}

.secondary-button {
    color: var(--green);
    background: white;
    border: 1px solid var(--green);
}

.route-notice {
    background: #fff7e7;
    border-left: 4px solid #d8ab52;
    padding: 13px 15px;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.8;
}

/* =====================================
   Tourism cards
===================================== */

.spot-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 270px), 1fr)
    );
    gap: 20px;
}

.spot-card {
    background: white;
    overflow: hidden;
    border-radius: 16px;
    box-shadow: 0 3px 16px #0000000a;
    transition: 0.25s;
    display: flex;
    flex-direction: column;
}

.spot-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 22px #00000014;
}

.spot-card img {
    height: 185px;
    width: 100%;
    object-fit: cover;
    display: block;
}

.spot-body {
    padding: 17px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.spot-body h3 {
    color: var(--green);
    margin: 10px 0 6px;
    font-size: 20px;
}

.spot-body p {
    font-size: 14px;
    line-height: 1.75;
}

.card-action {
    padding: 10px 14px;
    border: 1px solid var(--green);
    border-radius: 8px;
    color: var(--green);
    background: white;
    font-size: 13px;
    font-weight: bold;
    margin-top: auto;
}

.card-action:hover {
    background: var(--green);
    color: white;
}

.empty-state {
    text-align: center;
    padding: 40px 15px;
    color: var(--muted);
    grid-column: 1 / -1;
}

/* =====================================
   Travel tips
===================================== */

.travel-section {
    margin-top: 50px;
    background: var(--light-green);
    border-radius: 20px;
    padding: 25px;
}

.travel-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 230px), 1fr)
    );
    gap: 15px;
}

.travel-card {
    background: white;
    padding: 20px;
    border-radius: 13px;
}

.travel-card h3 {
    font-size: 18px;
    color: var(--green);
}

.travel-card p {
    font-size: 14px;
    line-height: 1.8;
}

.travel-icon {
    font-size: 30px;
}

/* =====================================
   Footer
===================================== */

footer {
    background: var(--dark-green);
    padding: 40px 20px;
    margin-top: 40px;
    text-align: center;
    color: white;
}

footer p {
    font-size: 13px;
    line-height: 1.8;
}

footer a {
    color: #d7f0e2;
}

.footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin: 20px 0;
}

#back-top {
    position: fixed;
    bottom: 18px;
    right: 18px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--green);
    color: white;
    font-size: 22px;
    border: 1px solid white;
    z-index: 1000;
    box-shadow: 0 3px 12px #0003;
}

/* =====================================
   Mobile responsive
===================================== */

@media (max-width: 750px) {

    html {
        scroll-padding-top: 120px;
    }

    .topbar {
        padding: 10px 12px;
    }

    .logo {
        font-size: 13px;
    }

    .nav-links {
        order: 3;
        width: 100%;
        justify-content: center;
        gap: 18px;
    }

    .nav-links a {
        font-size: 12px;
    }

    .hero {
        min-height: 340px;
        padding: 40px 15px;
    }

    .hero p {
        font-size: 15px;
    }

    main {
        padding: 20px 12px;
    }

    .search-row {
        grid-template-columns: 1fr 1fr;
    }

    #search {
        grid-column: 1 / -1;
    }

    .category-button {
        padding: 8px 11px;
        font-size: 12px;
    }

    .filter-panel {
        padding: 14px;
    }

    #map {
        height: 480px;
    }

    .statistics {
        grid-template-columns: repeat(2, 1fr);
    }

    .stat strong {
        font-size: 28px;
    }

    .stat span {
        font-size: 12px;
    }

    .leaflet-popup-content {
        width: 230px !important;
    }

    .popup-photo {
        height: 125px;
    }

    .routes-section,
    .route-detail,
    .travel-section {
        padding: 16px;
    }

    .route-actions {
        flex-direction: column;
    }

    .timeline-item {
        gap: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }

    * {
        transition: none !important;
    }
}

</style>
</head>

<body>

<!-- =====================================
     Navigation
====================================== -->

<nav class="topbar">

    <div class="logo">
        🌿 DISCOVER KUSHIRO
    </div>

    <div class="nav-links">

        <a href="#explore" id="nav-map">
            Map
        </a>

        <a href="#routes" id="nav-routes">
            Travel Routes
        </a>

        <a href="#spots" id="nav-spots">
            Attractions
        </a>

        <a href="#travel" id="nav-travel">
            Travel Tips
        </a>

    </div>

    <div class="language-switch">

        <button id="lang-en"
                class="active"
                onclick="setLanguage('en')">
            EN
        </button>

        <button id="lang-ja"
                onclick="setLanguage('ja')">
            日本語
        </button>

    </div>

</nav>

<!-- =====================================
     Hero
====================================== -->

<header class="hero" id="hero">

    <div class="hero-content">

        <div class="eyebrow">
            EASTERN HOKKAIDO · JAPAN
        </div>

        <h1>
            Discover Kushiro<br>&amp; Beyond
        </h1>

        <p id="hero-subtitle"></p>

        <div class="hero-actions">

            <a href="#explore"
               class="hero-button"
               id="hero-map"></a>

            <a href="#routes"
               class="hero-button secondary"
               id="hero-routes"></a>

        </div>

    </div>

    <div id="hero-credit"
         class="hero-credit"
         hidden></div>

</header>

<main>

<!-- =====================================
     Introduction
====================================== -->

<section class="intro">

    <h2 id="intro-title"></h2>

    <p id="intro-text"></p>

</section>

<div class="statistics">

    <div class="stat">
        <strong id="spot-count">54</strong>
        <span id="stat-spots"></span>
    </div>

    <div class="stat">
        <strong>6</strong>
        <span id="stat-categories"></span>
    </div>

    <div class="stat">
        <strong>9</strong>
        <span id="stat-areas"></span>
    </div>

    <div class="stat">
        <strong id="route-count">8</strong>
        <span id="stat-routes"></span>
    </div>

</div>

<!-- =====================================
     Interactive map
====================================== -->

<section id="explore">

    <h2 class="section-heading"
        id="map-heading"></h2>

    <div class="filter-panel">

        <div class="search-row">

            <input type="search"
                   id="search"
                   aria-label="Search tourism spots">

            <select id="area-filter"
                    aria-label="Tourism area"></select>

            <select id="season-filter"
                    aria-label="Best season"></select>

/* =====================================
   Utility functions
===================================== */

function escapeHTML(value) {

    return String(value).replace(
        /[&<>"']/g,
        ch => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        })[ch]
    );
}

function plainText(html) {

    return new DOMParser()
        .parseFromString(html || "", "text/html")
        .body.textContent || "";
}

function safeURL(value) {

    try {
        const url = new URL(value);

        if (
            url.protocol === "https:" ||
            url.protocol === "http:"
        ) {
            return url.href;
        }
    } catch (error) {
        return "";
    }

    return "";
}

function seasonText(item) {

    return item.seasons
        .map(s => seasons[s][lang])
        .join(lang === "ja" ? "・" : ", ");
}

function mapsURL(spot) {

    return "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
            spot.name.ja + " 北海道"

}

/* =====================================
   Wikimedia Commons photo loading

   Search for openly licensed photographs.
   Results must be checked before publication.
===================================== */

const photoCache = new Map();

const photoQueue = [];

let runningPhotoRequests = 0;

const maxPhotoRequests = 4;

function queuePhotoRequest(task) {

    return new Promise((resolve,reject) => {

        photoQueue.push({
            task,
            resolve,
            reject
        });

        processPhotoQueue();
    });
}

function processPhotoQueue() {

    while (
        runningPhotoRequests < maxPhotoRequests &&
        photoQueue.length
    ) {

        const job = photoQueue.shift();

        runningPhotoRequests++;

        Promise.resolve()
            .then(job.task)
            .then(job.resolve,job.reject)
            .finally(() => {

                runningPhotoRequests--;

                processPhotoQueue();
            });
    }
}

async function fetchPhoto(spot) {

    const key = spot.photoSearch;

    if (photoCache.has(key)) {
        return photoCache.get(key);
    }

    const promise = queuePhotoRequest(async () => {

        try {

            const params = new URLSearchParams({

                action: "query",

                generator: "search",

                gsrsearch: spot.photoSearch,

                gsrnamespace: "6",

                gsrlimit: "8",

                prop: "imageinfo",

                iiprop: "url|mime|extmetadata",

                iiurlwidth: "800",

                format: "json",

                origin: "*"
            });

            const response = await fetch(
                "https://commons.wikimedia.org/w/api.php?" +
                params.toString()
            );

            if (!response.ok) return null;

            const data = await response.json();

            const pages = Object.values(
                data.query?.pages || {}
            ).sort(
                (a,b) =>
                (a.index || 0) -
                (b.index || 0)
            );

            for (const page of pages) {

                const info = page.imageinfo?.[0];

                if (!info) continue;

                if (![
                    "image/jpeg",
                    "image/png",
                    "image/webp"
                ].includes(info.mime)) {
                    continue;
                }

                const metadata =
                    info.extmetadata || {};

                const license = plainText(
                    metadata.LicenseShortName?.value
                );

                if (!/^(CC BY|CC0|Public domain)/i
                    .test(license)) {
                    continue;
                }

                const imageURL = safeURL(
                    info.thumburl || info.url
                );

                if (!imageURL) continue;

                return {

                    url: imageURL,

                    source: safeURL(
                        info.descriptionurl
                    ),

                    author: plainText(
                        metadata.Artist?.value ||
                        "Wikimedia Commons contributor"
                    ),

                    license: license,

                    licenseURL: safeURL(
                        plainText(
                            metadata.LicenseUrl?.value
                        )
                    )
                };
            }

            return null;

        } catch (error) {

            return null;
        }
    });

    photoCache.set(key,promise);

    return promise;
}

function creditHTML(photo) {

    const author = escapeHTML(photo.author);

    const license = photo.licenseURL

        ? `<a href="${escapeHTML(photo.licenseURL)}"
              target="_blank"
              rel="noopener noreferrer">
              ${escapeHTML(photo.license)}
           </a>`

        : escapeHTML(photo.license);

    const source = photo.source

        ? `<a href="${escapeHTML(photo.source)}"
              target="_blank"
              rel="noopener noreferrer">
              Wikimedia Commons
           </a>`

        : "Wikimedia Commons";

    return `${author} · ${license} · ${source}`;
}

async function loadPhoto(container,spot) {

    const photo = await fetchPhoto(spot);

    const image = container.querySelector("img");

    const credit =
        container.querySelector(".photo-credit");

    if (!image) return;

    if (!photo) {

        image.src = placeholder(
            spot,
            t("photoUnavailable")
        );

        return;
    }

    image.onerror = () => {

        image.onerror = null;

        image.src = placeholder(
            spot,
            t("photoUnavailable")
        );

        if (credit) {
            credit.textContent =
                t("photoUnavailable");
        }
    };

    if (credit) {
        credit.innerHTML = creditHTML(photo);
    }

    image.src = photo.url;
}

/* Lazy photo loading */

const photoObserver =
    "IntersectionObserver" in window

    ? new IntersectionObserver(entries => {

        entries.forEach(entry => {

            if (!entry.isIntersecting) return;

            const card = entry.target;

            const spot = getSpot(
                Number(card.dataset.photoSpot)
            );

            if (spot) {
                loadPhoto(card,spot);
            }

            photoObserver.unobserve(card);
        });

    },{
        rootMargin: "150px"
    })

    : null;

function observePhoto(container,spot) {

    container.dataset.photoSpot = spot.id;

    if (photoObserver) {

        photoObserver.observe(container);

    } else {

        loadPhoto(container,spot);
    }
}

/* =====================================
   Tourism spot filtering
===================================== */

const searchInput = $("search");

const areaFilter = $("area-filter");

const seasonFilter = $("season-filter");

function getFilteredSpots() {

    const keyword =
        searchInput.value.trim().toLowerCase();

    const selectedArea =
        areaFilter.value || "all";

    const selectedSeason =
        seasonFilter.value || "all";

    return spots.filter(spot => {

        const categoryMatch =

            activeCategory === "all" ||

            activeCategory === spot.category;

        const areaMatch =

            selectedArea === "all" ||

            selectedArea === spot.area;

        const seasonMatch =

            selectedSeason === "all" ||

            spot.seasons.includes("year") ||

            spot.seasons.includes(selectedSeason);

        const searchText = [

            spot.name.en,

            spot.name.ja,

            spot.description.en,

            spot.description.ja,

            spot.recommendation.en,

            spot.recommendation.ja,

            areas[spot.area].en,

            areas[spot.area].ja,

            categories[spot.category].en,

            categories[spot.category].ja

        ].join(" ").toLowerCase();

        const searchMatch =

            keyword.split(/\s+/)
                .every(word =>
                    searchText.includes(word)
                );

        return categoryMatch &&
               areaMatch &&
               seasonMatch &&
               searchMatch;
    });
}

function renderMarkers(filtered,fitMap=true) {

    if (!map || !markerLayer) return;

    map.closePopup();

    clearRouteMap();

    markerLayer.clearLayers();

    Object.keys(markers).forEach(
        key => delete markers[key]
    );

    const coordinates = [];

    filtered.forEach(spot => {

        const marker = L.marker(

            [spot.lat,spot.lng],

            {

                icon: createIcon(spot),

                title: spot.name[lang],

                alt: spot.name[lang],

                keyboard: true,

                riseOnHover: true
            }
        );

        marker.bindPopup(

            () => createPopup(spot),

            {

                maxWidth: 300,

                autoPanPadding: [15,15]
            }
        );

        marker.bindTooltip(

            escapeHTML(spot.name[lang]),

            {

                direction: "top",

                offset: [0,-32]
            }
        );

        marker.addTo(markerLayer);

        markers[spot.id] = marker;

        coordinates.push(
            [spot.lat,spot.lng]
        );
    });

    if (fitMap && coordinates.length) {

        map.fitBounds(
            coordinates,
            {

                padding: [45,45],

                maxZoom: 15
            }
        );
    }
}

/* =====================================
   Display route on map

   Route lines represent stop order,
   not actual road geometry.
===================================== */

const dayColors = [
    "#28664d",
    "#368ab5",
    "#d18b3f"
];

function renderRouteMap(route,scroll=true) {

    activeRoute = route;

    updateMapMode();

    updateRouteSelection();

    if (!map) return;

    map.closePopup();

    markerLayer.clearLayers();

    clearRouteMap();

    Object.keys(markers).forEach(
        key => delete markers[key]
    );

    const allCoordinates = [];

    let stopNumber = 0;

    route.days.forEach((day,dayIndex) => {

        const coordinates = [];

        const color = route.days.length > 1

            ? dayColors[
                dayIndex % dayColors.length
              ]

            : route.color;

        day.stops.forEach(id => {

            const spot = getSpot(id);

            if (!spot) return;

            stopNumber++;

            const currentNumber = stopNumber;

            const position =
                [spot.lat,spot.lng];

            const marker = L.marker(

                position,

                {

                    icon: createRouteIcon(
                        currentNumber,
                        color
                    ),

                    title:
                        `${currentNumber}. ${spot.name[lang]}`,

                    keyboard: true
                }
            );

            marker.bindPopup(

                () => createPopup(
                    spot,
                    currentNumber
                ),

                {

                    maxWidth: 300,

                    autoPanPadding: [15,15]
                }
            );

            marker.bindTooltip(
                `${currentNumber}. ${escapeHTML(spot.name[lang])}`
            );

            marker.addTo(routeLayer);

            routeMarkers[currentNumber] = marker;

            coordinates.push(position);

            allCoordinates.push(position);
        });

        if (coordinates.length > 1) {

            L.polyline(

                coordinates,

                {

                    color: color,

                    weight: 4,

                    opacity: 0.85,

                    dashArray: "8 9",

                    lineJoin: "round"
                }

            ).addTo(routeLayer);
        }
    });

    if (allCoordinates.length) {

        map.fitBounds(

            allCoordinates,

            {

                padding: [55,55],

                maxZoom: 15
            }
        );
    }

    if (scroll) {

        $("explore").scrollIntoView({

            behavior: "smooth",

            block: "start"
        });
    }

    setTimeout(() => {

        map.invalidateSize();

    },250);
}

/* =====================================
   Google Maps route URLs

   Boat-only stops are excluded from
   walking and driving navigation.
===================================== */

function routeGoogleURL(route,dayIndex) {

    const day = route.days[dayIndex];

    const ids =
        day.navigationStops || day.stops;

    const destinations = ids

        .map(id => getSpot(id))

        .filter(Boolean)

        .map(navigationQuery);

    if (destinations.length < 2) {

        return mapsURL(
            getSpot(ids[0])
        );
    }

    const params = new URLSearchParams({

        api: "1",

        origin: destinations[0],

        destination:
            destinations[destinations.length - 1],

        travelmode:
            day.mode || route.travelMode
    });

    if (destinations.length > 2) {

        params.set(

            "waypoints",

            destinations
                .slice(1,-1)
                .join("|")
        );
    }

    return "https://www.google.com/maps/dir/?" +
        params.toString();
}

        dayHTML += `

            </div>

            ${day.boat

                ? `<p class="route-notice">
                       ${t("boatNotice")}
                   </p>`

                : ""
            }

            <a class="secondary-button"
               href="${escapeHTML(
                   routeGoogleURL(route,dayIndex)
               )}"
               target="_blank"
               rel="noopener noreferrer">

                ${t("routeGoogle")} ↗

            </a>
        `;
    });

    detail.innerHTML = `

        <div class="route-number">

            ${t("selectedRoute")}

        </div>

        <h2>

            ${escapeHTML(route.title[lang])}

        </h2>

        <div class="route-meta">

            <span>
                🕒 ${route.duration[lang]}
            </span>

            <span>
                🚘 ${route.transport[lang]}
            </span>

            <span>
                📅 ${seasonText(route)}
            </span>

        </div>

        <p>

            ${escapeHTML(route.description[lang])}

        </p>

        <div class="route-actions">

            <button class="primary-button"
                    id="show-route-map">

                🗺️ ${t("showRoute")}

            </button>

        </div>

        <h3>${t("itinerary")}</h3>

        <p>${t("routeHint")}</p>

        ${dayHTML}

        <div class="recommendation"
             style="margin-top:25px">

            <strong>${t("recommended")}</strong>

            <br>

            ${escapeHTML(route.tip[lang])}

        </div>

        <div class="route-notice"
             style="margin-top:15px">

            ${t("mapsNotice")}

        </div>

    `;

    $("show-route-map")
        .addEventListener("click",() => {

            renderRouteMap(route,true);
        });

    detail.querySelectorAll(
        "[data-route-stop]"
    ).forEach(button => {

        button.addEventListener("click",() => {

            const number =
                Number(button.dataset.routeStop);

            const spot = getSpot(
                Number(button.dataset.spotId)
            );

            if (!spot) return;

            if (!map) {

                window.open(
                    mapsURL(spot),
                    "_blank",
                    "noopener,noreferrer"
                );

                return;
            }

            if (
                !activeRoute ||
                activeRoute.id !== route.id
            ) {

                renderRouteMap(route,false);
            }

            $("explore").scrollIntoView({

                behavior: "smooth",

                block: "start"
            });

            map.setView(
                [spot.lat,spot.lng],
                15
            );

            if (routeMarkers[number]) {

                routeMarkers[number].openPopup();
            }
        });
    });
}

/* =====================================
   Render tourism cards
===================================== */

function renderCards(filtered) {

    const grid = $("spot-list");

    if (photoObserver) {

        grid.querySelectorAll(
            "[data-photo-spot]"
        ).forEach(card => {

            photoObserver.unobserve(card);
        });
    }

    grid.innerHTML = "";

    if (!filtered.length) {

        grid.innerHTML = `

            <div class="empty-state">

                ${t("noResults")}

            </div>`;

        return;
    }

    filtered.forEach(spot => {

        const cat =
            categories[spot.category];

        const card =
            document.createElement("article");

        card.className = "spot-card";

        card.innerHTML = `

            <img src="${placeholder(spot)}"
                 alt="${escapeHTML(spot.name[lang])}"
                 loading="lazy">

            <span class="photo-credit"></span>

            <div class="spot-body">

                <div>

                    <span class="badge"
                          style="background:${cat.color}">

                        ${cat.emoji} ${cat[lang]}

                    </span>

                </div>

                <h3>

                    ${escapeHTML(spot.name[lang])}

                </h3>

                <span class="area-label">

                    📍 ${areas[spot.area][lang]}

                </span>

                <p>

                    ${escapeHTML(
                        spot.description[lang]
                    )}

                </p>

                <div class="recommendation">

                    <strong>

                        ${t("recommended")}

                    </strong>

                    <br>

                    ${escapeHTML(
                        spot.recommendation[lang]
                    )}

                </div>

                <p class="season-info">

                    ${t("season")}:

                    ${seasonText(spot)}

                </p>

                <button class="card-action">

                    ${t("explore")}

                </button>

            </div>
        `;

        card.querySelector("button")

            .addEventListener("click",() => {

                showSpotOnMap(spot);
            });

        grid.appendChild(card);

        observePhoto(card,spot);
    });
}

/* =====================================
   Show an individual spot
===================================== */

function showSpotOnMap(spot) {

    if (!map) {

        window.open(

            mapsURL(spot),

            "_blank",

            "noopener,noreferrer"
        );

        return;
    }

    if (activeRoute) {

        exitRoute();
    }

    if (!markers[spot.id]) {

        resetFilters();
    }

    $("explore").scrollIntoView({

        behavior: "smooth",

        block: "start"
    });

    map.setView(

        [spot.lat,spot.lng],

        15
    );

    if (markers[spot.id]) {

        markers[spot.id].openPopup();
    }
}

/* =====================================
   Update results
===================================== */

function renderResults(fitMap=true) {

    const filtered =
        getFilteredSpots();

    $("result-count").textContent =

        `${filtered.length} ${t("results")}`;

    if (activeRoute) {

        renderRouteMap(
            activeRoute,
            false
        );

    } else {

        renderMarkers(
            filtered,
            fitMap
        );
    }

    renderCards(filtered);
}

/* =====================================
   Category buttons
===================================== */

function renderCategories() {

    const container =
        $("category-buttons");

    container.innerHTML = "";

    const allButton =
        document.createElement("button");

    allButton.className =
        "category-button";

    allButton.textContent =
        "🗺️ " + t("all");

    allButton.dataset.category = "all";

    container.appendChild(allButton);

    Object.entries(categories)

        .forEach(([key,cat]) => {

            const button =
                document.createElement("button");

            button.className =
                "category-button";

            button.dataset.category = key;

            button.style.setProperty(

                "--button-color",

                cat.color
            );

            button.textContent =

                `${cat.emoji} ${cat[lang]}`;

            container.appendChild(button);
        });

    container.querySelectorAll("button")

        .forEach(button => {

            button.addEventListener("click",() => {

                activeRoute = null;

                activeCategory =
                    button.dataset.category;

                updateCategoryButtons();

                updateMapMode();

                updateRouteSelection();

                renderResults();
            });
        });

    updateCategoryButtons();
}

function updateCategoryButtons() {

    document.querySelectorAll(
        ".category-button"
    ).forEach(button => {

        const selected =

            button.dataset.category ===
            activeCategory;

        button.classList.toggle(
            "active",
            selected
        );

        button.setAttribute(
            "aria-pressed",
            String(selected)
        );
    });
}

/* =====================================
   Area and season selectors
===================================== */

function renderSelects() {

    const oldArea =
        areaFilter.value || "all";

    const oldSeason =
        seasonFilter.value || "all";

    areaFilter.innerHTML = `

        <option value="all">

            ${t("allAreas")}

        </option>`;

    Object.entries(areas)

        .forEach(([key,area]) => {

            areaFilter.add(

                new Option(
                    area[lang],
                    key
                )
            );
        });

    seasonFilter.innerHTML = `

        <option value="all">

            ${t("allSeasons")}

        </option>`;

    ["spring","summer","autumn","winter"]

        .forEach(key => {

            seasonFilter.add(

                new Option(
                    seasons[key][lang],
                    key
                )
            );
        });

    areaFilter.value = oldArea;

    seasonFilter.value = oldSeason;

    searchInput.setAttribute(
        "aria-label",
        t("search")
    );

    areaFilter.setAttribute(
        "aria-label",
        t("allAreas")
    );

    seasonFilter.setAttribute(
        "aria-label",
        t("allSeasons")
    );
}

/* =====================================
   Legend
===================================== */

function renderLegend() {

    $("legend").innerHTML =

        Object.values(categories)

        .map(cat => `

            <span>

                <span class="legend-dot"
                      style="background:${cat.color}">
                </span>

                ${cat[lang]}

            </span>

        `).join("");
}

/* =====================================
   Language switching
===================================== */

function updateText() {

    document.documentElement.lang = lang;

    $("hero-subtitle").innerHTML =
        t("subtitle");

    const textElements = {

        "nav-map": "navMap",

        "nav-routes": "navRoutes",

        "nav-spots": "navSpots",

        "nav-travel": "navTravel",

        "hero-map": "heroMap",

        "hero-routes": "heroRoutes",

        "intro-title": "introTitle",

        "intro-text": "introText",

        "stat-spots": "spots",

        "stat-categories": "categories",

        "stat-areas": "areas",

        "stat-routes": "routes",

        "map-heading": "mapHeading",

        "reset-button": "reset",

        "map-instruction": "instruction",

        "map-note": "mapNote",

        "routes-heading": "routesHeading",

        "routes-description":
            "routesDescription",

        "spots-heading": "heading",

        "spots-description":
            "spotsDescription",

        "travel-heading": "travel",

        "footer-text": "footer",

        "footer-note": "footerNote",

        "exit-route-button": "exitRoute"
    };

    Object.entries(textElements)

        .forEach(([id,key]) => {

            $(id).textContent = t(key);
        });

    searchInput.placeholder =
        t("search");

    $("spot-count").textContent =
        spots.length;

    $("route-count").textContent =
        routes.length;

    $("lang-en").classList.toggle(
        "active",
        lang === "en"
    );

    $("lang-ja").classList.toggle(
        "active",
        lang === "ja"
    );

    $("lang-en").setAttribute(
        "aria-pressed",
        String(lang === "en")
    );

    $("lang-ja").setAttribute(
        "aria-pressed",
        String(lang === "ja")
    );

    if (!map) {

        $("map").textContent =
            t("mapUnavailable");

        $("map").style.padding = "30px";
    }

    updateMapMode();
}

function setLanguage(newLanguage) {

    if (!translations[newLanguage]) {
        return;
    }

    lang = newLanguage;

    updateText();

    renderSelects();

    renderCategories();

    renderLegend();

    renderRoutes();

    renderTravelTips();

    if (activeRoute) {

        renderRouteDetail(activeRoute);

    } else {

        const detail = $("route-detail");

        detail.classList.remove("visible");

        detail.innerHTML = "";
    }

    renderResults(false);
}

/* =====================================
   Filter events
===================================== */

let searchTimer;

function filterChanged() {

    activeRoute = null;

    updateMapMode();

    updateRouteSelection();

    renderResults();
}

searchInput.addEventListener("input",() => {

    clearTimeout(searchTimer);

    searchTimer = setTimeout(

        filterChanged,

        250
    );
});

areaFilter.addEventListener(

    "change",

    filterChanged
);

seasonFilter.addEventListener(

    "change",

    filterChanged
);

$("reset-button")

    .addEventListener(

        "click",

        resetFilters
    );

$("exit-route-button")

    .addEventListener("click",() => {

        resetFilters();
    });

/* =====================================
   Responsive map
===================================== */

window.addEventListener("resize",() => {

    if (map) {
        map.invalidateSize();
    }
});

/* =====================================
   Initialize application
===================================== */

setLanguage("en");

renderResults(true);

loadHeroPhoto();

</script>
