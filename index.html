
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover Kushiro & Beyond</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root {
    --green: #28664d;
    --dark-green: #173e32;
    --light-green: #e9f3e9;
    --blue: #368ab5;
    --orange: #e58b39;
    --purple: #9064ac;
    --pink: #cf7085;
    --brown: #97774e;
    --text: #29443a;
    --muted: #71847a;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, "Hiragino Sans", sans-serif;
    color: var(--text);
    background: #f5f8f4;
}

button, input, select {
    font: inherit;
}

button, select {
    cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
a:focus-visible {
    outline: 3px solid #368ab5;
    outline-offset: 3px;
}

/* Header */

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 5%;
    background: var(--dark-green);
    color: white;
}

.logo {
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;
}

.language-switch {
    display: flex;
    gap: 6px;
}

.language-switch button {
    border: 1px solid #ffffff70;
    background: transparent;
    color: white;
    padding: 7px 14px;
    border-radius: 20px;
}

.language-switch button.active {
    background: white;
    color: var(--dark-green);
}

.hero {
    position: relative;
    min-height: 370px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 65px 20px;
    background: linear-gradient(
        130deg,
        #163f32,
        #407f63,
        #3286a2
    );
    background-position: center;
    background-size: cover;
}

.hero-content {
    position: relative;
    z-index: 1;
}

.eyebrow {
    font-size: 13px;
    letter-spacing: 5px;
    font-weight: bold;
}

.hero h1 {
    font-size: clamp(36px, 6vw, 75px);
    margin: 18px 0;
    letter-spacing: 1px;
    line-height: 1.15;
    text-shadow: 0 3px 15px #0004;
}

.hero p {
    font-size: 18px;
    line-height: 1.8;
}

.hero-button {
    display: inline-block;
    background: white;
    color: var(--green);
    padding: 14px 26px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 15px;
}

/* Main */

main {
    max-width: 1400px;
    margin: auto;
    padding: 30px 22px;
}

.intro {
    max-width: 800px;
    margin: 15px auto 35px;
    text-align: center;
}

.intro h2 {
    font-size: 30px;
    color: var(--green);
}

.intro p {
    line-height: 1.9;
}

.statistics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 850px;
    margin: 30px auto;
}

.stat {
    background: white;
    padding: 22px 8px;
    text-align: center;
    border-radius: 16px;
    box-shadow: 0 3px 15px #00000008;
}

.stat strong {
    display: block;
    color: var(--green);
    font-size: 32px;
}

.stat span {
    display: block;
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
}

/* Filters */

.filter-panel {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 3px 20px #00000008;
    margin-bottom: 20px;
}

.search-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
}

.search-row input,
.search-row select {
    width: 100%;
    min-width: 0;
    padding: 13px;
    border: 1px solid #d5e1d8;
    background: #f9fbf9;
    border-radius: 10px;
    color: var(--text);
}

.category-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.category-button {
    background: white;
    border: 1px solid #dce5dc;
    border-radius: 25px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 14px;
    font-weight: bold;
    transition: 0.2s;
}

.category-button:hover {
    background: var(--light-green);
}

.category-button.active {
    color: white;
    background: var(--button-color, #28664d);
    border-color: transparent;
}

.result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
    font-size: 13px;
    color: var(--muted);
}

.reset-button {
    color: var(--green);
    border: none;
    background: transparent;
    text-decoration: underline;
}

/* Map */

.map-panel {
    background: white;
    border-radius: 20px;
    padding: 12px;
    box-shadow: 0 5px 25px #0000000b;
}

.map-instruction {
    text-align: center;
    padding: 10px;
    font-size: 14px;
}

#map {
    width: 100%;
    height: 650px;
    border-radius: 13px;
    background: #dfece1;
    z-index: 1;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    padding: 16px 5px;
    font-size: 12px;
}

.legend-dot {
    display: inline-block;
    height: 11px;
    width: 11px;
    margin-right: 5px;
    border-radius: 50%;
}

.map-note {
    font-size: 11px;
    text-align: center;
    color: var(--muted);
    line-height: 1.6;
}

.custom-marker {
    background: transparent;
    border: 0;
}

.marker-pin {
    width: 36px;
    height: 36px;
    border: 3px solid white;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 9px #0005;
}

.marker-pin span {
    transform: rotate(45deg);
    font-size: 17px;
}

/* Popup */

.leaflet-popup-content-wrapper {
    padding: 0;
    border-radius: 16px;
    overflow: hidden;
}

.leaflet-popup-content {
    margin: 0;
    width: 285px !important;
}

.leaflet-container a.leaflet-popup-close-button {
    top: 6px;
    right: 6px;
    border-radius: 50%;
    background: white;
    color: #234738;
}

.popup-photo {
    width: 100%;
    height: 165px;
    object-fit: cover;
    display: block;
}

.popup-body {
    padding: 15px;
}

.popup-body h3 {
    font-size: 20px;
    line-height: 1.3;
    color: var(--green);
    margin: 12px 0 5px;
}

.popup-body p {
    font-size: 13px;
    line-height: 1.7;
}

.area-label {
    font-size: 11px;
    color: var(--muted);
}

.badge {
    display: inline-block;
    color: white;
    border-radius: 20px;
    padding: 5px 10px;
    font-size: 10px;
    font-weight: bold;
}

.recommendation {
    padding: 12px;
    border-radius: 7px;
    background: #eef5ea;
    border-left: 4px solid #80a471;
    font-size: 13px;
    line-height: 1.7;
}

.season-info {
    margin-top: 12px;
    padding: 9px;
    background: #f6f5ee;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.6;
}

.direction-link {
    display: block;
    text-align: center;
    background: var(--green);
    color: white !important;
    padding: 11px;
    margin-top: 13px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
}

.photo-credit {
    display: block;
    font-size: 9px;
    color: var(--muted);
    padding: 4px 9px;
    overflow-wrap: anywhere;
}

/* Spot cards */

.section-heading {
    margin: 45px 0 20px;
    text-align: center;
    color: var(--green);
}

.spot-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 270px), 1fr)
    );
    gap: 20px;
}

.spot-card {
    background: white;
    overflow: hidden;
    border-radius: 16px;
    box-shadow: 0 3px 16px #0000000a;
    transition: 0.25s;
    display: flex;
    flex-direction: column;
}

.spot-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 22px #00000014;
}

.spot-card img {
    height: 185px;
    width: 100%;
    object-fit: cover;
    display: block;
}

.spot-body {
    padding: 17px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.spot-body h3 {
    color: var(--green);
    margin: 10px 0 6px;
    font-size: 20px;
}

.spot-body p {
    font-size: 14px;
    line-height: 1.75;
}

.card-action {
    padding: 10px 14px;
    border: 1px solid var(--green);
    border-radius: 8px;
    color: var(--green);
    background: white;
    font-size: 13px;
    font-weight: bold;
    margin-top: auto;
}

.card-action:hover {
    background: var(--green);
    color: white;
}

.empty-state {
    text-align: center;
    padding: 40px 15px;
    color: var(--muted);
    grid-column: 1 / -1;
}

/* Travel information */

.travel-section {
    margin-top: 50px;
    background: var(--light-green);
    border-radius: 20px;
    padding: 25px;
}

.travel-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 230px), 1fr)
    );
    gap: 15px;
}

.travel-card {
    background: white;
    padding: 20px;
    border-radius: 13px;
}

.travel-card h3 {
    font-size: 18px;
    color: var(--green);
}

.travel-card p {
    font-size: 14px;
    line-height: 1.8;
}

.travel-icon {
    font-size: 30px;
}

footer {
    background: var(--dark-green);
    padding: 40px 20px;
    margin-top: 40px;
    text-align: center;
    color: white;
}

footer p {
    font-size: 13px;
    line-height: 1.8;
}

footer a {
    color: #d7f0e2;
}

.footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    margin: 20px 0;
}

#back-top {
    position: fixed;
    bottom: 18px;
    right: 18px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--green);
    color: white;
    font-size: 22px;
    border: 1px solid white;
    z-index: 1000;
    box-shadow: 0 3px 12px #0003;
}

/* Mobile */

@media (max-width: 700px) {
    .topbar {
        padding: 12px;
    }

    .logo {
        font-size: 13px;
    }

    .hero {
        min-height: 300px;
        padding: 40px 15px;
    }

    .hero p {
        font-size: 15px;
    }

    main {
        padding: 20px 12px;
    }

    .search-row {
        grid-template-columns: 1fr 1fr;
    }

    #search {
        grid-column: 1 / -1;
    }

    .category-button {
        padding: 8px 11px;
        font-size: 12px;
    }

    .filter-panel {
        padding: 14px;
    }

    #map {
        height: 480px;
    }

    .stat strong {
        font-size: 25px;
    }

    .stat span {
        font-size: 11px;
    }

    .leaflet-popup-content {
        width: 235px !important;
    }

    .popup-photo {
        height: 125px;
    }

    .travel-section {
        padding: 16px;
    }
}
</style>
</head>

    id: i + 1,
    area: s[0],
    category: s[1],
    lat: s[2],
    lng: s[3],
    name: {
        en: s[4],
        ja: s[5]
    },
    description: {
        en: s[6],
        ja: s[7]
    },
    recommendation: {
        en: s[8],
        ja: s[9]
    },
    seasons: s[10].split(","),
    photoSearch: s[11]
}));

/* =====================================
   Utility functions
===================================== */

function escapeHTML(value) {
    return String(value).replace(
        /[&<>"']/g,
        ch => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"
        })[ch]
    );
}

function plainText(html) {
    return new DOMParser()
        .parseFromString(html || "", "text/html")
        .body.textContent || "";
}

function seasonText(spot) {
    return spot.seasons
        .map(s => seasons[s][lang])
        .join(lang === "ja" ? "・" : ", ");
}

function mapsURL(spot) {
    return "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
            spot.name.ja + " 北海道 " + areas[spot.area].ja
        );
}

function placeholder(spot) {
    const cat = categories[spot.category];

    const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="600" height="360">
        <rect width="600" height="360"
              fill="#e7efe7"/>
        <circle cx="300" cy="145" r="85"
                fill="${cat.color}" opacity=".13"/>
        <text x="300" y="170" text-anchor="middle"
              font-size="80">${cat.emoji}</text>
        <text x="300" y="270" text-anchor="middle"
              font-size="18" fill="#28664d">
            ${escapeHTML(t("photoUnavailable"))}
        </text>
    </svg>`;

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg);
}

/* =====================================
   Wikimedia Commons photos

   Only openly licensed photos are selected.
   Search results require manual verification
   before publishing this website.
===================================== */

const photoCache = new Map();

async function fetchPhoto(spot) {

    if (photoCache.has(spot.id)) {
        return photoCache.get(spot.id);
    }

    const promise = (async () => {
        try {
            const params = new URLSearchParams({
                action: "query",
                generator: "search",
                gsrsearch: spot.photoSearch,
                gsrnamespace: "6",
                gsrlimit: "6",
                prop: "imageinfo",
                iiprop: "url|mime|extmetadata",
                iiurlwidth: "640",
                format: "json",
                origin: "*"
            });

            const response = await fetch(
                "https://commons.wikimedia.org/w/api.php?" +
                params.toString()
            );

            if (!response.ok) return null;

            const data = await response.json();

            const pages = Object.values(
                data.query?.pages || {}
            ).sort((a,b) =>
                (a.index || 0) - (b.index || 0)
            );

            for (const page of pages) {

                const info = page.imageinfo?.[0];

                if (!info) continue;

                if (![
                    "image/jpeg",
                    "image/png",
                    "image/webp"
                ].includes(info.mime)) continue;

                const meta = info.extmetadata || {};

                const license = plainText(
                    meta.LicenseShortName?.value
                );

                if (!/^(CC BY|CC0|Public domain)/i
                    .test(license)) continue;

                return {
                    url: info.thumburl || info.url,
                    source: info.descriptionurl,
                    author: plainText(
                        meta.Artist?.value ||
                        "Wikimedia Commons contributor"
                    ),
                    license: license,
                    licenseURL: plainText(
                        meta.LicenseUrl?.value
                    )
                };
            }

            return null;

        } catch (error) {
            return null;
        }
    })();

    photoCache.set(spot.id, promise);

    return promise;
}

async function loadPhoto(container, spot) {

    const photo = await fetchPhoto(spot);

    const image = container.querySelector("img");

    const credit = container.querySelector(".photo-credit");

    if (!photo || !image) return;

    image.onerror = () => {
        image.onerror = null;
        image.src = placeholder(spot);

        if (credit) {
            credit.textContent = t("photoUnavailable");
        }
    };

    if (credit) {
        const license = escapeHTML(photo.license);

        const licenseURL =
            /^https?:\/\//i.test(photo.licenseURL)
            ? photo.licenseURL
            : "";

        const licenseLink = licenseURL
            ? `<a href="${escapeHTML(licenseURL)}"
                  target="_blank" rel="noopener">
                  ${license}
               </a>`
            : license;

        credit.innerHTML = `
            ${escapeHTML(photo.author)}
            · ${licenseLink}
            · <a href="${escapeHTML(photo.source)}"
                 target="_blank" rel="noopener">
                 Wikimedia Commons
               </a>`;
    }

    image.src = photo.url;
}

/* Lazy loading for photos */

const photoObserver =
    "IntersectionObserver" in window
    ? new IntersectionObserver(entries => {

        entries.forEach(entry => {

            if (!entry.isIntersecting) return;

            const card = entry.target;

            const spot = spots.find(
                s => s.id === Number(card.dataset.spot)
            );

            if (spot) loadPhoto(card, spot);

            photoObserver.unobserve(card);
        });

    }, {
        rootMargin: "200px"
    })
    : null;

/* =====================================
   Leaflet map
===================================== */

let map = null;
let markerLayer = null;
const markers = {};

if (typeof L !== "undefined") {

    map = L.map("map", {
        scrollWheelZoom: false
    }).setView([43.22,144.49], 9);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }
    ).addTo(map);

    L.control.scale({
        imperial: false
    }).addTo(map);

    markerLayer = L.layerGroup().addTo(map);

} else {

    document.getElementById("map").textContent =
        "Map unavailable. Please check your internet connection.";

}

function createIcon(spot) {

    const cat = categories[spot.category];

    return L.divIcon({
        className: "custom-marker",

        html: `
            <div class="marker-pin"
                 style="background:${cat.color}">
                <span>${cat.emoji}</span>
            </div>`,

        iconSize: [36,36],
        iconAnchor: [18,36],
        popupAnchor: [0,-35]
    });
}

/* =====================================
   Map popups
===================================== */

function createPopup(spot) {

    const cat = categories[spot.category];

    const el = document.createElement("div");

    el.innerHTML = `

        <img class="popup-photo"
             src="${placeholder(spot)}"
             alt="${escapeHTML(spot.name[lang])}">

        <span class="photo-credit"></span>

        <div class="popup-body">

            <span class="badge"
                  style="background:${cat.color}">
                ${cat.emoji} ${cat[lang]}
            </span>

            <h3>${escapeHTML(spot.name[lang])}</h3>

            <div class="area-label">
                📍 ${areas[spot.area][lang]}
            </div>

            <p>${escapeHTML(spot.description[lang])}</p>

            <div class="recommendation">
                <strong>${t("recommended")}</strong><br>
                ${escapeHTML(spot.recommendation[lang])}
            </div>

            <div class="season-info">
                <strong>${t("season")}</strong><br>
                ${seasonText(spot)}
            </div>

            <a class="direction-link"
               href="${mapsURL(spot)}"
               target="_blank" rel="noopener">
                ${t("directions")}
            </a>

        </div>
    `;

    loadPhoto(el, spot);

    return el;
}

/* =====================================
   Filtering
===================================== */

const searchInput =
    document.getElementById("search");

const areaFilter =
    document.getElementById("area-filter");

const seasonFilter =
    document.getElementById("season-filter");

function getFilteredSpots() {

    const keyword =
        searchInput.value.trim().toLowerCase();

    const selectedArea = areaFilter.value;

    const selectedSeason = seasonFilter.value;

    return spots.filter(spot => {

        const categoryMatch =
            activeCategory === "all" ||
            activeCategory === spot.category;

        const areaMatch =
            selectedArea === "all" ||
            selectedArea === spot.area;

        const seasonMatch =
            selectedSeason === "all" ||
            spot.seasons.includes("year") ||
            spot.seasons.includes(selectedSeason);

        const searchText = [
            spot.name.en,
            spot.name.ja,
            spot.description.en,
            spot.description.ja,
            spot.recommendation.en,
            spot.recommendation.ja,
            areas[spot.area].en,
            areas[spot.area].ja,
            categories[spot.category].en,
            categories[spot.category].ja
        ].join(" ").toLowerCase();

        const searchMatch =
            keyword.split(/\s+/)
                .every(word => searchText.includes(word));

        return categoryMatch &&
               areaMatch &&
               seasonMatch &&
               searchMatch;
    });
}

/* =====================================
   Render markers
===================================== */

function renderMarkers(filtered, fitMap = true) {

    if (!map || !markerLayer) return;

    markerLayer.clearLayers();

    Object.keys(markers).forEach(
        key => delete markers[key]
    );

    const coordinates = [];

    filtered.forEach(spot => {

        const marker = L.marker(
            [spot.lat,spot.lng],
            {
                icon: createIcon(spot),
                title: spot.name[lang],
                alt: spot.name[lang],
                keyboard: true,
                riseOnHover: true
            }
        );

        marker.bindPopup(
            () => createPopup(spot),
            {
                maxWidth: 300,
                autoPanPadding: [15,15]
            }
        );

        marker.bindTooltip(
            escapeHTML(spot.name[lang]),
            {
                direction: "top",
                offset: [0,-32]
            }
        );

        marker.addTo(markerLayer);

        markers[spot.id] = marker;

        coordinates.push([spot.lat,spot.lng]);

    });

    if (fitMap && coordinates.length) {

        map.fitBounds(coordinates, {
            padding: [40,40],
            maxZoom: 14
        });
    }
}

/* =====================================
   Render tourism cards
===================================== */

function renderCards(filtered) {

    const grid = document.getElementById("spot-list");

    if (photoObserver) {
        photoObserver.disconnect();
    }

    grid.innerHTML = "";

    if (!filtered.length) {
        grid.innerHTML = `
            <div class="empty-state">
                ${t("noResults")}
            </div>`;
        return;
    }

    filtered.forEach(spot => {

        const cat = categories[spot.category];

        const card = document.createElement("article");

        card.className = "spot-card";

        card.dataset.spot = spot.id;

        card.innerHTML = `

            <img src="${placeholder(spot)}"
                 alt="${escapeHTML(spot.name[lang])}"
                 loading="lazy">

            <span class="photo-credit"></span>

            <div class="spot-body">

                <div>
                    <span class="badge"
                          style="background:${cat.color}">
                        ${cat.emoji} ${cat[lang]}
                    </span>
                </div>

                <h3>${escapeHTML(spot.name[lang])}</h3>

                <span class="area-label">
                    📍 ${areas[spot.area][lang]}
                </span>

                <p>${escapeHTML(spot.description[lang])}</p>

                <div class="recommendation">
                    <strong>${t("recommended")}</strong><br>
                    ${escapeHTML(spot.recommendation[lang])}
                </div>

                <p class="season-info">
                    ${t("season")}: ${seasonText(spot)}
                </p>

                <button class="card-action">
                    ${t("explore")}
                </button>

            </div>
        `;

        card.querySelector("button")
            .addEventListener("click", () => {

                if (!map) {
                    window.open(
                        mapsURL(spot),
                        "_blank",
                        "noopener"
                    );
                    return;
                }

                document.getElementById("map")
                    .scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

                map.setView(
                    [spot.lat,spot.lng],
                    15
                );

                if (markers[spot.id]) {
                    markers[spot.id].openPopup();
                }
            });

        grid.appendChild(card);

        if (photoObserver) {
            photoObserver.observe(card);
        } else {
            loadPhoto(card,spot);
        }

    });
}

function renderResults(fitMap = true) {

    const filtered = getFilteredSpots();

    document.getElementById("result-count")
        .textContent =
            `${filtered.length} ${t("results")}`;

    renderMarkers(filtered, fitMap);

    renderCards(filtered);
}

/* =====================================
   Category buttons
===================================== */

function renderCategories() {

    const container =
        document.getElementById("category-buttons");

    container.innerHTML = "";

    const allButton = document.createElement("button");

    allButton.className = "category-button";

    allButton.textContent = "🗺️ " + t("all");

    allButton.dataset.category = "all";

    container.appendChild(allButton);

    Object.entries(categories).forEach(([key,cat]) => {

        const button = document.createElement("button");

        button.className = "category-button";

        button.dataset.category = key;

        button.style.setProperty(
            "--button-color",cat.color
        );

        button.textContent =
            `${cat.emoji} ${cat[lang]}`;

        container.appendChild(button);
    });

    container.querySelectorAll("button")
        .forEach(button => {

            button.addEventListener("click", () => {

                activeCategory =
                    button.dataset.category;

                updateCategoryButtons();

                renderResults();
            });
        });

    updateCategoryButtons();
}

function updateCategoryButtons() {

    document.querySelectorAll(".category-button")
        .forEach(button => {

            const selected =
                button.dataset.category === activeCategory;

            button.classList.toggle("active",selected);

            button.setAttribute(
                "aria-pressed",
                String(selected)
            );
        });
}

/* =====================================
   Area and season selections
===================================== */

function renderSelects() {

    const oldArea = areaFilter.value || "all";

    const oldSeason = seasonFilter.value || "all";

    areaFilter.innerHTML =
        `<option value="all">${t("allAreas")}</option>`;

    Object.entries(areas).forEach(([key,area]) => {

        areaFilter.add(
            new Option(area[lang],key)
        );
    });

    seasonFilter.innerHTML =
        `<option value="all">${t("allSeasons")}</option>`;

    ["spring","summer","autumn","winter"]
        .forEach(key => {

            seasonFilter.add(
                new Option(seasons[key][lang],key)
            );
        });

    areaFilter.value = oldArea;

    seasonFilter.value = oldSeason;
}

function renderLegend() {

    document.getElementById("legend").innerHTML =
        Object.values(categories).map(cat => `

            <span>
                <span class="legend-dot"
                      style="background:${cat.color}">
                </span>
                ${cat[lang]}
            </span>

        `).join("");
}

/* =====================================
   Language switching
===================================== */

function updateText() {

    document.documentElement.lang = lang;

    document.getElementById("hero-subtitle")
        .innerHTML = t("subtitle");

    const textElements = {

        "hero-button":"heroButton",
        "intro-title":"introTitle",
        "intro-text":"introText",
        "stat-spots":"spots",
        "stat-categories":"categories",
        "stat-areas":"areas",
        "reset-button":"reset",
        "map-instruction":"instruction",
        "map-note":"mapNote",
        "spots-heading":"heading",
        "travel-heading":"travel",
        "footer-text":"footer",
        "footer-note":"footerNote"
    };

    Object.entries(textElements)
        .forEach(([id,key]) => {

            document.getElementById(id)
                .textContent = t(key);
        });

    searchInput.placeholder = t("search");

    document.getElementById("spot-count")
        .textContent = spots.length;

    document.getElementById("lang-en")
        .classList.toggle("active",lang === "en");

    document.getElementById("lang-ja")
        .classList.toggle("active",lang === "ja");

    document.getElementById("lang-en")
        .setAttribute("aria-pressed",String(lang === "en"));

    document.getElementById("lang-ja")
        .setAttribute("aria-pressed",String(lang === "ja"));
}

function setLanguage(newLanguage) {

    lang = newLanguage;

    updateText();

    renderSelects();

    renderCategories();

    renderLegend();

    renderTravelTips();

    renderResults(false);
}

/* =====================================
   Events
===================================== */

let searchTimer;

searchInput.addEventListener("input", () => {

    clearTimeout(searchTimer);

    searchTimer = setTimeout(
        () => renderResults(),
        250
    );
});

areaFilter.addEventListener(
    "change",
    () => renderResults()
);

seasonFilter.addEventListener(
    "change",
    () => renderResults()
);

document.getElementById("reset-button")
    .addEventListener("click", () => {

        activeCategory = "all";

        searchInput.value = "";

        areaFilter.value = "all";

        seasonFilter.value = "all";

        updateCategoryButtons();

        renderResults();
    });

/* =====================================
   Initialize website
===================================== */

setLanguage("en");

renderResults(true);

</script>
